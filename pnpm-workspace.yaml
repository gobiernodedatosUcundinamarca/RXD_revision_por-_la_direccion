# ESLint 10 aunque eslint-plugin-import, -jsx-a11y y -react (que trae
# eslint-config-next) aún declaren `eslint <=9`: ESLint 9 está sin soporte desde
# el 2026-08-06 y la regla del proyecto exige la última versión con soporte de
# seguridad. Verificado que los tres plugins siguen detectando errores con la 10.
# Retirar en cuanto los plugins amplíen su rango (`pnpm peers check`).
#
# TypeScript queda en `^6` (package.json) y no en la 7 (`latest`):
# typescript-eslint, que usa eslint-config-next, solo soporta `<6.1`. Subir a la
# 7 cuando typescript-eslint la admita (`pnpm view typescript-eslint peerDependencies`).
peerDependencyRules:
  allowedVersions:
    eslint: "10"

# Scripts de instalación autorizados (pnpm 11 exige decidirlo explícitamente).
# Ambos son dependencias nativas de las herramientas ya declaradas en el
# proyecto: `sharp` es el motor de imágenes de Next.js y `unrs-resolver` el
# resolvedor de importaciones de eslint-config-next. Sin autorizarlos, ningún
# script de `package.json` puede ejecutarse.
allowBuilds:
  sharp: true
  unrs-resolver: true

# Versiones forzadas de dependencias transitivas con avisos de seguridad.
# Ninguna es dependencia directa del proyecto: llegan a través de next,
# @tailwindcss/postcss, eslint y @playwright/test, cuyos rangos aún admiten
# versiones vulnerables (CLAUDE.md §2: no fusionar con vulnerabilidades altas
# o críticas).
#
# `brace-expansion` se acota POR VERSIÓN MAYOR, y el reemplazo va con `^` a
# propósito: minimatch@3 espera la API de la versión 1, y tanto un override
# global como un reemplazo abierto (`>=1.1.18`) resuelven a la 5, con lo que
# ESLint deja de arrancar.
#
# Al cambiar este bloque hay que re-resolver el árbol (`pnpm update`): `pnpm
# install` no vuelve a resolver si el lockfile ya está satisfecho. Revisar en
# cada `pnpm outdated` si ya pueden retirarse porque el paquete padre actualizó
# su rango.
overrides:
  postcss: ">=8.5.23"
  nanoid: ">=3.3.18"
  js-yaml: ">=4.3.1"
  "brace-expansion@1": "^1.1.21"
  "brace-expansion@2": "^2.0.2"
  "brace-expansion@5": "^5.0.12"
  sharp: ">=0.35.5"
  source-map-js: ">=1.2.2"

# Avisos sin versión corregida publicada, ignorados con justificación.
# GHSA-vfj7-8cjw-p6xm (braces <=3.0.3, DoS con patrones muy anidados): no hay
# parche (3.0.3 es la última). Solo llega por el lint
# (@next/eslint-plugin-next > fast-glob > micromatch), con patrones fijados en
# la configuración, nunca entrada de usuario, y no viaja al build. Retirar en
# cuanto exista parche.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
